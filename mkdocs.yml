      - "03 · Locators: ID, Name, Class, Tag, Link Text": level-1/03-locators-basic.md
      - "04 · Locators: CSS Selectors": level-1/04-locators-css.md
      - "05 · Locators: XPath": level-1/05-locators-xpath.md
      - "06 · Interacting With Elements: Click, Type, Clear": level-1/06-interacting-with-elements.md
      - "07 · Dropdowns, Checkboxes & Radio Buttons": level-1/07-dropdowns-checkboxes-radios.md
      - "08 · Browser Navigation: Back, Forward, Refresh": level-1/08-browser-navigation.md
      - "09 · Reading Element State: Text, Attributes, Visibility": level-1/09-element-state.md
