site_name: Selenium Mastery Path
site_description: A free Selenium WebDriver course — locators, waits, Page Object Model, Selenium Grid, and real test framework design.
site_url: https://sigilipelli.github.io/selenium-mastery-path/
repo_url: https://github.com/sigilipelli/selenium-mastery-path
repo_name: selenium-mastery-path

theme:
  name: material
  favicon: assets/favicon.svg
  custom_dir: docs/overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css
  - stylesheets/progress-tracker.css

extra_javascript:
  - javascripts/progress-tracker.js

nav:
  - Home: index.md
  - Privacy Policy: privacy.md
  - License: license.md
  - "Level 1 · WebDriver Fundamentals & Locators":
      - Overview: level-1/index.md
